[test-groups]
game-process = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(binary_id(p4kx::it) & test(read_only::)) | (binary_id(p4kx-gui::it) & test(read_only::)) | (binary_id(p4kx-guard::installation) & test(notices_a_running_game_from_the_process_list))'
test-group = 'game-process'

[profile.ci]
fail-fast = false
retries = 0
slow-timeout = { period = "120s", terminate-after = 5 }
status-level = "fail"
final-status-level = "slow"

[[profile.ci.overrides]]
filter = 'package(p4kx-render)'
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'package(p4kx-render)'
slow-timeout = { period = "60s", terminate-after = 3 }
