name: Set up Rust
description: Shared build setup of the CI jobs, run after checkout

inputs:
  cache-key:
    description: Distinct rust-cache key per job type
    required: true
  components:
    description: Extra toolchain components
    default: ""
  nextest:
    description: Install cargo-nextest
    default: "false"

runs:
  using: composite
  steps:
    - name: Link with rust-lld on Windows
      if: runner.os == 'Windows'
      shell: bash
      run: echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe" >> "$GITHUB_ENV"
    - name: Link with mold on Linux
      if: runner.os == 'Linux'
      uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
    - name: Select mold as the Linux linker
      if: runner.os == 'Linux'
      shell: bash
      run: echo "RUSTFLAGS=-Clink-arg=-fuse-ld=mold" >> "$GITHUB_ENV"
    - name: Mount a ReFS Dev Drive as the target directory
      if: runner.os == 'Windows'
      uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
      with:
        drive-size: 60GB
        mount-path: target
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        key: ${{ inputs.cache-key }}
    - name: Install cargo-nextest
      if: inputs.nextest == 'true'
      uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
      with:
        tool: nextest
    - name: Install the ALSA headers the audio output builds against
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
