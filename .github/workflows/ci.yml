name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_PROFILE: ci

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
          components: rustfmt, clippy
      - name: Formatting, one package at a time to keep the Windows command line short
        shell: bash
        run: |
          for package in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r'); do
            cargo fmt -p "$package" --check
          done
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo xtask
      - name: Install cargo-about
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices are complete
        if: runner.os == 'Linux'
        run: cargo xtask notices
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
          nextest: "true"
      - name: Tests with nextest, one process per test
        run: cargo nextest run --workspace --locked
      - name: Doctests, which nextest does not run
        run: cargo test --workspace --locked --doc
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  focused:
    name: Schemas and concurrency (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: focused
          nextest: "true"
      - name: Comparison report schema is current
        run: cargo nextest run --locked -p p4kx-comparison --test report_schema
      - name: Record JSON schema matches the export
        run: cargo nextest run --locked -p p4kx-export --test record_json_schema
      - name: Basetool catalog schema is current
        run: cargo nextest run --locked -p p4kx-export --test catalog_schema
      - name: DataForge lazy indexes survive concurrent lookups
        run: cargo nextest run --cargo-profile concurrency --locked -p p4kx-dataforge --test lazy_indexes
      - name: Audio index survives concurrent first use
        run: cargo nextest run --cargo-profile concurrency --locked -p p4kx-assembly --test audio_lazy_index
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  check:
    name: Check (${{ matrix.os }})
    needs: [lint, test, focused]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Fail unless every parallel job succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
