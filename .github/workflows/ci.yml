name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_PROFILE: ci

jobs:
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: lint
          components: rustfmt, clippy
      - name: Formatting, one package at a time to keep the Windows command line short
        shell: bash
        run: |
          for package in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r'); do
            cargo fmt -p "$package" --check
          done
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo xtask
      - name: Install cargo-about
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices are complete
        if: runner.os == 'Linux'
        run: cargo xtask notices
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  tests-windows:
    name: Tests (windows-latest)
    uses: ./.github/workflows/tests.yml
    with:
      os: windows-latest
      partitions: "[1, 2, 3, 4]"
      count: 4

  tests-ubuntu:
    name: Tests (ubuntu-24.04)
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-24.04
      partitions: "[1, 2]"
      count: 2
  doctests:
    name: Doctests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: doctests
      - name: Doctests, which nextest does not run
        run: cargo test --workspace --locked --doc
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /
  focused:
    name: Schemas and concurrency (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: focused
          nextest: "true"
      - name: Comparison report schema is current
        run: cargo nextest run --locked -p p4kx-comparison --test report_schema
      - name: Blender package schema is current
        run: cargo nextest run --locked -p p4kx-blender --test schema
      - name: Record JSON schema matches the export
        run: cargo nextest run --locked -p p4kx-export --test record_json_schema
      - name: Basetool catalog schema is current
        run: cargo nextest run --locked -p p4kx-export --test catalog_schema
      - name: DataForge lazy indexes survive concurrent lookups
        run: cargo nextest run --cargo-profile concurrency --locked -p p4kx-dataforge --test lazy_indexes
      - name: Audio index survives concurrent first use
        run: cargo nextest run --cargo-profile concurrency --locked -p p4kx-assembly --test audio_lazy_index
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  blender-addon:
    name: Blender add-on (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: blender_addon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: blender_addon/requirements-ci.txt
      - name: Install system libraries of the bpy module
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxi6 libxrender1 libsm6 libxxf86vm1 libxfixes3 libxkbcommon0
        working-directory: .
      - name: Install pytest and Blender as a Python module
        run: python -m pip install -r requirements-ci.txt
      - name: Add-on tests without Blender
        run: python -m pytest
      - name: Import a synthetic package in headless Blender
        run: python tests/blender_smoke.py

  glb-validator:
    name: Khronos glTF-Validator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: glb-validator
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pinned validator from the lockfile, without install scripts
        run: npm ci --ignore-scripts --prefix .github/glb-validator
      - name: Write the GLBs of the synthetic fixtures
        run: P4KX_VALIDATOR_DIR="$RUNNER_TEMP/validator-glbs" cargo test --locked -p p4kx-gltf --test it the_synthetic_glbs_are_written_for_the_validator
      - name: Validate them, failing on any error
        run: node .github/glb-validator/validate.mjs "$RUNNER_TEMP/validator-glbs"

  check:
    name: Check (${{ matrix.os }})
    needs: [lint, tests-windows, tests-ubuntu, doctests, focused, blender-addon, glb-validator]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Fail unless every parallel job succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
