name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the ALSA headers the audio output builds against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Formatting, one package at a time to keep the Windows command line short
        shell: bash
        run: |
          for package in $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r'); do
            cargo fmt -p "$package" --check
          done
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Comparison report schema is current
        run: cargo test --locked -p p4kx-comparison --test report_schema
      - name: Record JSON schema matches the export
        run: cargo test --locked -p p4kx-export --test record_json_schema
      - name: Basetool catalog schema is current
        run: cargo test --locked -p p4kx-export --test catalog_schema
      - name: DataForge lazy indexes survive concurrent lookups
        run: cargo test --release --locked -p p4kx-dataforge --test lazy_indexes
      - name: Audio index survives concurrent first use
        run: cargo test --release --locked -p p4kx-assembly --test audio_lazy_index
      - run: cargo xtask
      - name: Install cargo-about
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices are complete
        if: runner.os == 'Linux'
        run: cargo xtask notices
