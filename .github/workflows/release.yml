name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
      - "crates/p4kx-gui/wix/**"
      - "crates/p4kx-gui/assets/p4kx.ico"
      - "crates/p4kx-gui/build.rs"
      - "crates/p4kx/build.rs"
      - "blender_addon/**"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate the release tag
        if: github.ref_type == 'tag'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -cnotmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Refusing to release from tag '$env:REF_NAME': expected vMAJOR.MINOR.PATCH[-suffix]."
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
        with:
          lookup-only: ${{ github.ref_type == 'tag' }}
      - name: Version
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'p4kx-gui').version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $core = [version]($version -replace '-.*$', '')
          "version=$version" >> $env:GITHUB_OUTPUT
          "msi_version=$core" >> $env:GITHUB_OUTPUT
          "next_msi_version=$($core.Major).$($core.Minor).$($core.Build + 1)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force target\package | Out-Null
          cargo xtask release-notes $env:TAG target\package\release-notes.md
      - name: Build
        run: cargo build --release --locked -p p4kx-gui -p p4kx -p p4kx-mcp
      - name: Portable ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "P4KX-$env:VERSION-x86_64"
          $folder = "target\package\$name"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item target\release\p4kx-gui.exe, target\release\p4kx.exe, target\release\p4kx-mcp.exe, LICENSE-MIT, LICENSE-MIT.md, LICENSE-APACHE, LICENSE-APACHE.md, THIRD-PARTY-NOTICES.md, CHANGELOG.md $folder
          Compress-Archive -Path $folder -DestinationPath "target\package\$name-portable.zip"
      - name: Blender add-on version equals the Release version
        run: cargo xtask addon
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Blender add-on ZIP
        run: python blender_addon\build_zip.py target\package
      - name: Install WiX Toolset
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'wix-tool'
          dotnet tool install wix --version 7.0.0 --tool-path $toolPath
          "WIX_EXE=$(Join-Path $toolPath 'wix.exe')" >> $env:GITHUB_ENV
      - name: MSI
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MSI_VERSION: ${{ steps.version.outputs.msi_version }}
        run: |
          .github\scripts\build-msi.ps1 -Wix $env:WIX_EXE -Version $env:MSI_VERSION -Output "target\package\P4KX-$env:VERSION-x86_64.msi"
      - name: Install, upgrade and uninstall
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEXT_MSI_VERSION: ${{ steps.version.outputs.next_msi_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force target\wix-check, target\wix-previous | Out-Null
          gh release download v0.2.0 --repo p4kx-org/p4kx --pattern "*.msi" --dir target\wix-previous
          $previous = (Get-ChildItem target\wix-previous -Filter *.msi | Select-Object -First 1).FullName
          .github\scripts\build-msi.ps1 -Wix $env:WIX_EXE -Version $env:NEXT_MSI_VERSION -Output target\wix-check\next.msi
          $upgradeCode = ([xml](Get-Content crates\p4kx-gui\wix\main.wxs)).Wix.Package.UpgradeCode
          .github\scripts\check-msi.ps1 -Msi "target\package\P4KX-$env:VERSION-x86_64.msi" -NextMsi target\wix-check\next.msi -NextVersion $env:NEXT_MSI_VERSION -UpgradeCode $upgradeCode -PreviousMsi $previous
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: msiexec-logs
          path: target/wix-check/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            target/package/*.zip
            target/package/*.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-notes
          path: target/package/release-notes.md
          if-no-files-found: error

  sbom:
    name: SBOM
    runs-on: windows-latest
    permissions:
      contents: read
    needs: package
    env:
      VERSION: ${{ needs.package.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
        with:
          key: sbom
          lookup-only: ${{ github.ref_type == 'tag' }}
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: CycloneDX SBOM of each shipped binary
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries
          New-Item -ItemType Directory -Force target\sbom | Out-Null
          foreach ($crate in 'p4kx-gui', 'p4kx', 'p4kx-mcp') {
            $source = Get-ChildItem -Path crates -Recurse -Filter "${crate}_bin.cdx.json" | Select-Object -First 1
            if (-not $source) { throw "No SBOM was generated for $crate." }
            Move-Item $source.FullName "target\sbom\P4KX-$env:VERSION-$crate.cdx.json"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: target/sbom/*.cdx.json
          if-no-files-found: error

  scan:
    name: VirusTotal scan
    needs: package
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: assets
      - name: Scan the MSI and the portable ZIP
        continue-on-error: true
        timeout-minutes: 55
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $files = @(Get-ChildItem assets/*.msi, assets/*-portable.zip | ForEach-Object FullName)
          ./.github/scripts/virustotal-scan.ps1 -Path $files -NotePath virustotal.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virustotal-note
          path: virustotal.md
          if-no-files-found: ignore

  attest:
    name: Attest build provenance
    needs: [package, sbom]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.package.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{release,sbom}"
          path: assets
          merge-multiple: true
      - name: Build provenance of every asset
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/*.zip
            assets/*.msi
            assets/*.cdx.json
      - name: SBOM attestation of p4kx-gui
        id: sbom-gui
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            assets/*-portable.zip
            assets/*.msi
          sbom-path: assets/P4KX-${{ env.VERSION }}-p4kx-gui.cdx.json
      - name: SBOM attestation of p4kx
        id: sbom-cli
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            assets/*-portable.zip
            assets/*.msi
          sbom-path: assets/P4KX-${{ env.VERSION }}-p4kx.cdx.json
      - name: SBOM attestation of p4kx-mcp
        id: sbom-mcp
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            assets/*-portable.zip
            assets/*.msi
          sbom-path: assets/P4KX-${{ env.VERSION }}-p4kx-mcp.cdx.json
      - name: Name the bundles after their files
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_GUI: ${{ steps.sbom-gui.outputs.bundle-path }}
          SBOM_CLI: ${{ steps.sbom-cli.outputs.bundle-path }}
          SBOM_MCP: ${{ steps.sbom-mcp.outputs.bundle-path }}
        run: |
          mkdir bundles
          cp "$PROVENANCE" "bundles/P4KX-${VERSION}-provenance.sigstore.json"
          cp "$SBOM_GUI" "bundles/P4KX-${VERSION}-p4kx-gui.cdx.json.sigstore.json"
          cp "$SBOM_CLI" "bundles/P4KX-${VERSION}-p4kx.cdx.json.sigstore.json"
          cp "$SBOM_MCP" "bundles/P4KX-${VERSION}-p4kx-mcp.cdx.json.sigstore.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestations
          path: bundles/*.sigstore.json
          if-no-files-found: error

  assemble:
    name: Hashes and release notes
    needs: [package, sbom, scan, attest]
    if: ${{ !cancelled() && needs.package.result == 'success' && needs.sbom.result == 'success' && (needs.attest.result == 'success' || github.ref_type != 'tag') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{release,sbom,attestations}"
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{changelog-notes,virustotal-note}"
          path: notes
          merge-multiple: true
      - name: SHA256SUMS, SHA3-512SUMS and release notes
        env:
          REPOSITORY: ${{ github.repository }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          if ($env:SCAN_RESULT -ne 'skipped' -and -not (Test-Path notes/virustotal.md)) {
            New-Item -ItemType Directory -Force notes | Out-Null
            Set-Content notes/virustotal.md -Encoding utf8NoBOM -Value "## Security check`n`nThe VirusTotal scan did not run for this release (the scan job ended without a result)."
          }
          $scan = if (Test-Path notes/virustotal.md) { 'notes/virustotal.md' }
          ./.github/scripts/assemble-release.ps1 -AssetDirectory assets -NotesPath notes/release-notes.md `
            -OutputNotesPath notes/final-notes.md -VirusTotalNotePath $scan -Repository $env:REPOSITORY
          Get-ChildItem assets | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/final-notes.md
          if-no-files-found: error

  publish:
    name: Publish
    needs: [package, assemble]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate the release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to release from tag '$REF_NAME': expected vMAJOR.MINOR.PATCH[-suffix]." >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$REF_NAME" --verify-tag --title "P4KX $VERSION" \
            --notes-file notes/final-notes.md --generate-notes "${prerelease[@]}" assets/*
