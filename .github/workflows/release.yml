name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/scripts/build-msi.ps1"
      - ".github/scripts/check-msi.ps1"
      - "crates/p4kx-gui/wix/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'p4kx-gui').version
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          $core = [version]($version -replace '-.*$', '')
          "version=$version" >> $env:GITHUB_OUTPUT
          "msi_version=$core" >> $env:GITHUB_OUTPUT
          "next_msi_version=$($core.Major).$($core.Minor).$($core.Build + 1)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force target\package | Out-Null
          cargo xtask release-notes $env:TAG target\package\release-notes.md
      - name: Build
        run: cargo build --release --locked -p p4kx-gui -p p4kx -p p4kx-mcp
      - name: Portable ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "P4KX-$env:VERSION-x86_64"
          $folder = "target\package\$name"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item target\release\p4kx-gui.exe, target\release\p4kx.exe, target\release\p4kx-mcp.exe, LICENSE-MIT, LICENSE-APACHE, THIRD-PARTY-NOTICES, CHANGELOG.md $folder
          Compress-Archive -Path $folder -DestinationPath "target\package\$name-portable.zip"
      - name: Install WiX Toolset
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'wix-tool'
          dotnet tool install wix --version 7.0.0 --tool-path $toolPath
          "WIX_EXE=$(Join-Path $toolPath 'wix.exe')" >> $env:GITHUB_ENV
      - name: MSI
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MSI_VERSION: ${{ steps.version.outputs.msi_version }}
        run: |
          .github\scripts\build-msi.ps1 -Wix $env:WIX_EXE -Version $env:MSI_VERSION -Output "target\package\P4KX-$env:VERSION-x86_64.msi"
      - name: Install, upgrade and uninstall
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEXT_MSI_VERSION: ${{ steps.version.outputs.next_msi_version }}
        run: |
          New-Item -ItemType Directory -Force target\wix-check | Out-Null
          .github\scripts\build-msi.ps1 -Wix $env:WIX_EXE -Version $env:NEXT_MSI_VERSION -Output target\wix-check\next.msi
          $upgradeCode = ([xml](Get-Content crates\p4kx-gui\wix\main.wxs)).Wix.Package.UpgradeCode
          .github\scripts\check-msi.ps1 -Msi "target\package\P4KX-$env:VERSION-x86_64.msi" -NextMsi target\wix-check\next.msi -NextVersion $env:NEXT_MSI_VERSION -UpgradeCode $upgradeCode
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: msiexec-logs
          path: target/wix-check/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            target/package/*.zip
            target/package/*.msi
            target/package/release-notes.md
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "P4KX $VERSION" --notes-file release/release-notes.md "${prerelease[@]}" \
            release/*.zip release/*.msi
