name: Tests

on:
  workflow_call:
    inputs:
      os:
        type: string
        required: true
      partitions:
        type: string
        required: true
      count:
        type: number
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_PROFILE: ci

jobs:
  build-tests:
    name: Build tests (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    steps:
      - name: Disk space before the build
        if: runner.os == 'Linux'
        run: df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
          nextest: "true"
      - name: Build every test binary once and archive them
        run: cargo nextest archive --workspace --locked --archive-file nextest-archive.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive-${{ inputs.os }}
          path: nextest-archive.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Disk space after the build
        if: runner.os == 'Linux'
        run: df -h /

  test:
    name: Test (${{ inputs.os }} ${{ matrix.partition }}/${{ inputs.count }})
    needs: build-tests
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON(inputs.partitions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive-${{ inputs.os }}
      - name: Install the software Vulkan driver (lavapipe) the render tests draw on
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - name: Tests with nextest, one process per test
        env:
          P4KX_REQUIRE_SOFTWARE_ADAPTER: '1'
          PARTITION: ${{ matrix.partition }}
          PARTITION_COUNT: ${{ inputs.count }}
        shell: bash
        run: cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --extract-to . --extract-overwrite --partition "count:${PARTITION}/${PARTITION_COUNT}"
      - name: Name the software adapter the render tests drew on
        env:
          P4KX_REQUIRE_SOFTWARE_ADAPTER: '1'
        run: cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --extract-to . --extract-overwrite --no-capture -E 'test(the_software_adapter_is_named)'
