[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/krt-profit/p4k-extractor"
publish = false

[workspace.dependencies]
p4kx-foundation = { path = "crates/p4kx-foundation" }
p4kx-archive = { path = "crates/p4kx-archive" }
p4kx-channels = { path = "crates/p4kx-channels" }
p4kx-extraction = { path = "crates/p4kx-extraction" }
p4kx-settings = { path = "crates/p4kx-settings" }
p4kx-testkit = { path = "crates/p4kx-testkit" }
aes = "0.9.3"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
cbc = "0.2.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
predicates = "3.1.4"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unused_qualifications = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
missing_assert_message = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_pub_crate = "allow"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
