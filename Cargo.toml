[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/krt-profit/p4k-extractor"
publish = false

[workspace.dependencies]
p4kx-foundation = { path = "crates/p4kx-foundation" }
p4kx-archive = { path = "crates/p4kx-archive" }
p4kx-audio = { path = "crates/p4kx-audio" }
p4kx-channels = { path = "crates/p4kx-channels" }
p4kx-dataforge = { path = "crates/p4kx-dataforge" }
p4kx-comparison = { path = "crates/p4kx-comparison" }
p4kx-cryxml = { path = "crates/p4kx-cryxml" }
p4kx-extraction = { path = "crates/p4kx-extraction" }
p4kx-settings = { path = "crates/p4kx-settings" }
p4kx-testkit = { path = "crates/p4kx-testkit" }
p4kx-texture = { path = "crates/p4kx-texture" }
p4kx-update = { path = "crates/p4kx-update" }
aes = "0.9.3"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
bcdec_rs = "0.2.0"
cbc = "0.2.1"
crc32c = "0.6.8"
ctrlc = "3.5.2"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37.0"
egui_extras = "0.37.0"
egui_kittest = "0.37.0"
exr = "1.74.2"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
half = "2.7.1"
insta = "1.49.0"
png = "0.18.1"
predicates = "3.1.4"
raw-window-handle = "0.6.2"
rayon = "1.12.0"
rfd = "0.17.2"
rmcp = { version = "3.5.1", default-features = false, features = ["macros", "server", "transport-io"] }
roxmltree = "0.21.1"
ruzstd = "0.9.1"
schemars = "1.2.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.53.3"
toml = "1.1.8"
unic-langid = "0.9.6"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unused_qualifications = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
missing_assert_message = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_pub_crate = "allow"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
