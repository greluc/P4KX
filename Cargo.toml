[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/p4kx-org/p4kx"
publish = false

[workspace.dependencies]
p4kx-foundation = { path = "crates/p4kx-foundation" }
p4kx-gltf = { path = "crates/p4kx-gltf" }
p4kx-model = { path = "crates/p4kx-model" }
p4kx-archive = { path = "crates/p4kx-archive" }
p4kx-assembly = { path = "crates/p4kx-assembly" }
p4kx-audio = { path = "crates/p4kx-audio" }
p4kx-blender = { path = "crates/p4kx-blender" }
p4kx-channels = { path = "crates/p4kx-channels" }
p4kx-character = { path = "crates/p4kx-character" }
p4kx-chunks = { path = "crates/p4kx-chunks" }
p4kx-dataforge = { path = "crates/p4kx-dataforge" }
p4kx-comparison = { path = "crates/p4kx-comparison" }
p4kx-cryxml = { path = "crates/p4kx-cryxml" }
p4kx-extraction = { path = "crates/p4kx-extraction" }
p4kx-export = { path = "crates/p4kx-export" }
p4kx-gfx = { path = "crates/p4kx-gfx" }
p4kx-guard = { path = "crates/p4kx-guard" }
p4kx-localization = { path = "crates/p4kx-localization" }
p4kx-render = { path = "crates/p4kx-render" }
p4kx-screens = { path = "crates/p4kx-screens" }
p4kx-search = { path = "crates/p4kx-search" }
p4kx-settings = { path = "crates/p4kx-settings" }
p4kx-testkit = { path = "crates/p4kx-testkit" }
p4kx-texture = { path = "crates/p4kx-texture" }
p4kx-update = { path = "crates/p4kx-update" }
aes = "0.9.3"
anyhow = "1.0.104"
assert_cmd = "2.2.2"
base64 = "0.23.1"
bcdec_rs = "0.2.0"
bytemuck = "1.25.2"
cbc = "0.2.1"
crc32c = "0.6.8"
crc32fast = "1.5.3"
ctrlc = "3.5.2"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37.0"
egui_extras = "0.37.0"
egui_kittest = "0.37.0"
exr = "1.74.2"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
gltf = { version = "1.4.1", default-features = false }
gltf-json = { version = "1.4.1", default-features = false }
half = "2.7.1"
insta = "1.49.0"
jsonschema = { version = "0.59.0", default-features = false }
lewton = { version = "0.10.2", default-features = false }
lzma-rs = "0.3.0"
opus-pure = "=0.2.2"
png = "0.18.1"
predicates = "3.1.4"
proptest = "1.12.0"
raw-window-handle = "0.6.2"
rayon = "1.12.0"
rfd = "0.17.2"
rmcp = { version = "3.5.1", default-features = false, features = ["macros", "server", "transport-io"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
roxmltree = "0.21.2"
rpassword = "7.5.4"
ruzstd = "0.9.1"
schemars = "1.2.3"
same-file = "1.0.6"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sys-locale = "0.3.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
tokio = "1.53.3"
toml = "1.1.8"
unic-langid = "0.9.6"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "metal"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
winresource = "0.1.34"
zstd = { version = "0.14.3", default-features = false }
zune-core = "0.5.0"
zune-jpeg = "0.5.15"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unused_qualifications = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
expect_used = "deny"
get_unwrap = "deny"
indexing_slicing = "deny"
missing_assert_message = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
redundant_pub_crate = "allow"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_in_result = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package.zstd-sys]
opt-level = 3

[profile.concurrency]
inherits = "dev"
debug = false
debug-assertions = false

[profile.concurrency.package.p4kx-dataforge]
opt-level = 3

[profile.concurrency.package.p4kx-assembly]
opt-level = 3

[profile.concurrency.package.p4kx-extraction]
opt-level = 3

[profile.concurrency.package.rayon]
opt-level = 3

[profile.concurrency.package.rayon-core]
opt-level = 3
